{% extends "layout.html" %}
{% block title %}Contacto | Portfolio{% endblock %}
{% block content %}
<section style="max-width: 550px;">
    <h1>Contacto</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem;">
        ¿Tienes un proyecto, propuesta o consulta técnica? Envíame un mensaje y te responderé a la brevedad.
    </p>

    <!-- Sustituye la URL de action por tu Endpoint de Formspree -->
    <form action="https://formspree.io/f/mzedkzbo" method="POST">
        <div class="form-group">
            <label for="name">Nombre</label>
            <input type="text" id="name" name="name" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="_replyto" required placeholder="tu@email.com">
        </div>
        <div class="form-group">
            <label for="message">Mensaje</label>
            <textarea id="message" name="message" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>
        <button type="submit" class="btn" style="width: 100%; margin-top: 0.5rem;">Enviar Mensaje</button>
    </form>
</section>
{% endblock %}
